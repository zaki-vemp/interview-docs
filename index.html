<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interview preparation report docs for a Senior Full Stack / Frontend developer."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23237864'/><path d='M16 10c-3-2-6-2-9-1v14c3-1 6-1 9 1 3-2 6-2 9-1V9c-3-1-6-1-9 1zm0 0v14' fill='none' stroke='white' stroke-width='1.5' stroke-linejoin='round'/></svg>"
    />
    <title>Interview Prep · Study desk</title>
    <script>
      try {
        var a = JSON.parse(localStorage.getItem('ipd:appearance:v1') || '{}');
        var t = a?.mode || localStorage.getItem('ipd:theme');
        document.documentElement.dataset.theme =
          t === 'dark' || t === 'light'
            ? t
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.palette = ['sage', 'ocean', 'mint'].includes(a?.palette)
          ? a.palette
          : 'sage';
        document.documentElement.dataset.density = a?.density === 'compact' ? 'compact' : 'comfortable';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
